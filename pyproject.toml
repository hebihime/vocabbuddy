[project]
name = "vocabbuddy"
version = "0.1.0"
description = "turn your vocab lists into flashcards"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
